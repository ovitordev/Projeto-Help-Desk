<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Chamado | ChamaAI</title>
</head>

<body>
    <header>
        <h1>ChamaAI</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="abrir-chamado.html">Abrir Chamado</a></li>
                <li><a href="chamados.html">Meus Chamados</a></li>
                <li><a href="#">Configurações</a></li>
                <li><a href="#">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Abrir Novo Chamado</h2>

        <form>
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" name="titulo" required />

            <label for="desc">Descrição:</label>
            <textarea id="desc" name="desc" rows="9" cols="50" required></textarea>

            <label for="categoria">Categoria:</label>
            <select id="categoria" name="categoria" required>
                <option value="" selected disabled>Selecione uma categoria</option>
                <option value="hardware">Hardware</option>
                <option value="software">Software</option>
                <option value="rede">Rede</option>
            </select>

            <label for="prioridade">Prioridade:</label>
            <select id="prioridade" name="prioridade" required>
                <option value="" selected disabled>Selecione a prioridade</option>
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
            </select>

            <button type="submit">Enviar chamado</button>
        </form>
    </main>
</body>

</html>
